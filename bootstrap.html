<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Bootstrap Introduction</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    </head>
    <style>
        body{
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            text-align: center;
            margin: 40px;
            margin-bottom: 50px;
        }
       </style>
       <body>
        <h1>Bootstrap 12 Column Grip</h1>
        <div class="container">
        <div class="row">
            <div class="col-4 col-sm-4">Section 1 by 4</div>
            <div class="col-4 col-sm-4">Section 2 by 4</div>
            <div class="col-4 col-sm-4">Section 3 by 4</div>
        </div>
        </div>
        <div class="container">
        <div class="row">
            <div class="col-6" style="background-color: cadetblue; border-radius: 40px; font-size: 20px; color: blue; text-align: center;">
                Section 1 by 6
            </div>
            <div class="col-6">
                Section 2 by 6</div>
        </div>
        </div>
        <div class="container">
        <div class="row">
            <div class="col-3 col-md-4 col-lg-3">Section 1 by 3</div>
            <div class="col-3 col-md-4 col-lg-3">Section 2 by 3</div>
            <div class="col-3 col-md-4 col-lg-3">Section 3 by 3</div>
            <div class="col-3 col-md-12 col-lg-3">Section 4 by 3</div>
        </div>
        </div>
        
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
    </body>
